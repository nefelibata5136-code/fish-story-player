name: Windows portable bundle

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -e ".[dev]" "pyinstaller==6.22.3"
      - run: python -m pytest -q
      - run: python scripts/release_check.py
      - run: python scripts/build_windows.py
      - name: Frozen CLI and MCP smoke test without user state
        run: python scripts/check_windows_bundle.py dist/FishStoryPlayer-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fish-story-player-windows-x64
          path: |
            dist/FishStoryPlayer-Windows-x64.zip
            dist/FishStoryPlayer-Windows-x64.zip.sha256
          if-no-files-found: error
